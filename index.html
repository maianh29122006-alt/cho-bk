                                        <label className="block font-bold text-gray-700 mb-1">Ảnh sản phẩm (Tải từ máy hoặc dán link)</label>
                                        <input type="file" accept="image/*" onChange={handleImageUpload} className="text-xs mb-2 block" />
                                        <input
                                            type="text"
                                            value={productModal.data.image}
                                            onChange={(e) => setProductModal({ ...productModal, data: { ...productModal.data, image: e.target.value } })}
                                            placeholder="Hoặc dán đường dẫn ảnh (tùy chọn)..."
                                            className="w-full border rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-[#cf2c28]"
                                        />
                                    </div>
                                    <div>
                                        <label className="block font-bold text-gray-700 mb-1">Mô tả chi tiết & Địa điểm giao dịch</label>
                                        <textarea
                                            rows="3"
                                            value={productModal.data.description}
                                            onChange={(e) => setProductModal({ ...productModal, data: { ...productModal.data, description: e.target.value } })}
                                            placeholder="Mô tả chi tiết tình trạng, khu vực giao dịch tại trường..."
                                            className="w-full border rounded-lg px-3 py-2 focus:outline-none focus:border-[#cf2c28]"
                                        ></textarea>
                                    </div>
                                    <div className="pt-2 flex gap-2">
                                        <button type="button" onClick={() => setProductModal({ open: false, mode: 'create', data: null })} className="flex-1 py-2 border rounded-lg font-bold text-gray-600">
                                            Hủy
                                        </button>
                                        <button type="submit" className="flex-1 py-2 bg-[#cf2c28] text-white rounded-lg font-bold hover:bg-red-800">
                                            {productModal.mode === 'create' ? 'Đăng tin ngay' : 'Lưu thay đổi'}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* === MODAL CHI TIẾT SẢN PHẨM === */}
                    {detailModal && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl w-full max-w-2xl shadow-2xl overflow-hidden max-h-[90vh] flex flex-col">
                                <div className="relative h-64 bg-gray-100">
                                    <img src={detailModal.image} alt={detailModal.title} className="w-full h-full object-cover" />
                                    <button onClick={() => setDetailModal(null)} className="absolute top-3 right-3 bg-black/60 text-white p-1.5 rounded-full hover:bg-black">
                                        <Icon name="x" />
                                    </button>
                                </div>
                                <div className="p-6 overflow-y-auto">
                                    <div className="flex items-center gap-2 mb-2">
                                        <span className="bg-red-50 text-[#cf2c28] text-xs font-bold px-2.5 py-0.5 rounded">{detailModal.category}</span>
                                        <span className={`text-xs font-bold px-2.5 py-0.5 rounded ${detailModal.status === 'Đang bán' ? 'bg-green-100 text-green-700' : 'bg-gray-200 text-gray-700'}`}>
                                            {detailModal.status}
                                        </span>
                                    </div>
                                    <h2 className="text-xl font-black text-gray-900">{detailModal.title}</h2>
                                    <div className="text-2xl font-black text-[#cf2c28] my-2">{detailModal.price.toLocaleString('vi-VN')} đ</div>
                                    <p className="text-xs text-gray-500 mb-4">Người bán: <b>{detailModal.sellerName}</b> ({detailModal.sellerEmail}) • Ngày đăng: {detailModal.createdAt}</p>
                                    <div className="bg-gray-50 p-4 rounded-xl text-sm text-gray-700 space-y-2 mb-5">
                                        <p><b>Tình trạng:</b> {detailModal.condition}</p>
                                        <p><b>Mô tả chi tiết:</b> {detailModal.description}</p>
                                    </div>
                                    {currentUser.email !== detailModal.sellerEmail && (
                                        <button
                                            onClick={() => { const p = detailModal; setDetailModal(null); openChatWithSeller(p); }}
                                            className="w-full bg-[#cf2c28] text-white py-2.5 rounded-xl font-bold text-sm hover:bg-red-800 flex items-center justify-center gap-2"
                                        >
                                            <Icon name="message" /> Nhắn tin trao đổi với người bán
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* === MODAL KHUNG CHAT TRỰC TIẾP === */}
                    {chatModal && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl w-full max-w-md shadow-2xl overflow-hidden flex flex-col h-[500px]">
                                <div className="bg-[#cf2c28] p-4 text-white flex justify-between items-center">
                                    <div>
                                        <h4 className="font-bold text-sm">{chatModal.partnerName}</h4>
                                        <p className="text-[11px] text-red-100 truncate max-w-[260px]">SP: {chatModal.productTitle}</p>
                                    </div>
                                    <button onClick={() => setChatModal(null)}><Icon name="x" /></button>
                                </div>
                                <div className="flex-1 p-4 overflow-y-auto space-y-3 bg-gray-50">
                                    {messages
                                        .filter(m => m.productId === chatModal.productId && (
                                            (m.senderEmail === currentUser.email && m.receiverEmail === chatModal.partnerEmail) ||
                                            (m.senderEmail === chatModal.partnerEmail && m.receiverEmail === currentUser.email)
                                        ))
                                        .map(m => {
                                            const isMe = m.senderEmail === currentUser.email;
                                            return (
                                                <div key={m.id} className={`flex flex-col ${isMe ? 'items-end' : 'items-start'}`}>
                                                    <div className={`px-3.5 py-2 rounded-2xl text-xs max-w-[80%] ${isMe ? 'bg-[#cf2c28] text-white rounded-br-none' : 'bg-white border text-gray-800 rounded-bl-none'}`}>
                                                        {m.text}
                                                    </div>
                                                    <span className="text-[10px] text-gray-400 mt-1">{m.time}</span>
                                                </div>
                                            );
                                        })}
                                </div>
                                <form onSubmit={handleSendMessage} className="p-3 bg-white border-t flex gap-2">
                                    <input
                                        type="text"
                                        placeholder="Nhập tin nhắn hỏi mua hàng..."
                                        value={chatInput}
                                        onChange={(e) => setChatInput(e.target.value)}
                                        className="flex-1 border rounded-full px-4 py-2 text-xs focus:outline-none focus:border-[#cf2c28]"
                                    />
                                    <button type="submit" className="bg-[#cf2c28] text-white p-2 rounded-full hover:bg-red-800">
                                        <Icon name="send" />
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* === MODAL KHIẾU NẠI BÀI ĐĂNG === */}
                    {reportModal && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl w-full max-w-sm shadow-2xl overflow-hidden">
                                <div className="bg-amber-600 p-4 text-white flex justify-between items-center">
                                    <h4 className="font-bold text-sm flex items-center gap-1.5"><Icon name="alert" /> Khiếu nại bài đăng</h4>
                                    <button onClick={() => setReportModal(null)}><Icon name="x" /></button>
                                </div>
                                <form onSubmit={handleSubmitReport} className="p-4 space-y-3 text-sm">
                                    <p className="text-xs text-gray-600">Sản phẩm: <b>{reportModal.title}</b></p>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 mb-1">Chọn lý do vi phạm:</label>
                                        <select
                                            value={reportReason}
                                            onChange={(e) => setReportReason(e.target.value)}
                                            className="w-full border rounded-lg p-2 text-xs bg-white"
                                        >
                                            <option>Sản phẩm cấm / Vi phạm quy định</option>
                                            <option>Thông tin sai sự thật / Lừa đảo</option>
                                            <option>Trùng lặp / Spam tin đăng</option>
                                            <option>Hàng đã bán nhưng không cập nhật</option>
                                        </select>
                                    </div>
                                    <div className="flex gap-2 pt-2">
                                        <button type="button" onClick={() => setReportModal(null)} className="flex-1 py-2 border rounded-lg text-xs font-bold">Hủy</button>
                                        <button type="submit" className="flex-1 py-2 bg-amber-600 text-white rounded-lg text-xs font-bold hover:bg-amber-700">Gửi báo cáo</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
